all:
  children:
    target_servers:
      hosts:
        server-app-01:
          ansible_host: 192.168.1.10   # IP server
          ansible_user: ubuntu         # User SSH
          
        server-app-02:
          ansible_host: 192.168.1.11
          ansible_user: ubuntu

  vars:
    # ---------------------------------------------
    # Variabel Konfigurasi OS (setup-os.yml)
    # ---------------------------------------------
    ansible_port: 10123 
    
    # ---------------------------------------------
    # Variabel Monitoring Agent (install-agent.yml)
    # ---------------------------------------------
    node_exporter_version: "1.8.2"           
    monitoring_server_ip: "10.0.0.100"       
    
    # ---------------------------------------------
    # Variabel Deploy Klinik (deploy-klinik.yml)
    # ---------------------------------------------
    install_dir: "/opt/aplikasi-klinik"               # Path instalasi di server
    repository: "nama-organisasi/repo-klinik"         # Format: username/repo atau org/repo
    github_username: "user_anda"                      # Username Github Anda
    
    # PERHATIAN: Menyimpan token asli di plain text sangat tidak disarankan untuk production!
    # Sebaiknya gunakan Ansible Vault atau passing argumen via CLI.
    # Untuk uji coba, Anda bisa menyimpannya sementara di sini:
    git_pat: "ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"